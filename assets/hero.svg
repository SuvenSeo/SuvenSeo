<svg width="100%" viewBox="0 0 1200 410" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Suven Seoras — SUVEN//OS mission control</title>
  <desc id="d">Animated mission-control deck for Suven Seoras and Ardeno Studio: identity panel, live EKG pipeline trace, a phosphor radar scope, system status LEDs, and a scrolling live-systems ticker across AI, data, automation and web lanes.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#01040c"/><stop offset=".55" stop-color="#060c18"/><stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <radialGradient id="roseCorner" cx="1200" cy="0" r="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a0f1a" stop-opacity=".5"/><stop offset=".45" stop-color="#21090f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="36" y1="0" x2="1154" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity="0"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="1006" y1="160" x2="1106" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity=".5"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000" stop-opacity="0"/><stop offset=".4" stop-color="#fff"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0e1a2e" stroke-width="1" shape-rendering="crispEdges"/>
    </pattern>
    <mask id="gridMask"><rect width="1200" height="410" fill="url(#gridFade)"/></mask>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="frameClip"><rect x="16" y="16" width="1168" height="378" rx="14"/></clipPath>
    <clipPath id="tickerClip"><rect x="32" y="346" width="1136" height="40" rx="9"/></clipPath>
    <style>
      .ekg{stroke-dasharray:522;animation:draw 4.4s cubic-bezier(.65,0,.35,1) infinite;}
      @keyframes draw{0%{stroke-dashoffset:0}50%{stroke-dashoffset:522}100%{stroke-dashoffset:0}}
      .flow{stroke-dasharray:4 12;animation:flow 2.4s linear infinite;}
      @keyframes flow{to{stroke-dashoffset:-32}}
      .caret{animation:cb 1.06s step-end infinite;}
      @keyframes cb{50%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="410" fill="url(#bgGrad)"/>
  <rect width="1200" height="410" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1200" height="410" fill="url(#roseCorner)"/>

  <g clip-path="url(#frameClip)">
    <!-- moving scanline (SMIL) -->
    <rect x="16" y="-140" width="1168" height="140" fill="url(#sweepGrad)" opacity=".05">
      <animate attributeName="y" values="-140;410" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- top status strip -->
    <text x="40" y="42" font-family="Consolas,'SF Mono',monospace" font-size="12" fill="#38bdf8" letter-spacing="1.5">SUVEN//OS · MISSION CONTROL DECK</text>
    <text x="1066" y="42" font-family="Consolas,'SF Mono',monospace" font-size="12" fill="#34d399" text-anchor="end">STATUS: ONLINE</text>
    <circle cx="1080" cy="38" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="1.7s" repeatCount="indefinite"/></circle>
    <rect x="36" y="50" width="1118" height="2" fill="url(#rule)" opacity=".8"/>
  </g>

  <!-- ===== IDENTITY CARD C ===== -->
  <g>
    <rect x="36" y="60" width="482" height="228" rx="10" fill="#060c17" fill-opacity=".55" stroke="#16243c"/>
    <text x="66" y="122" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="50" font-weight="700" fill="#f4f9ff">Suven Seoras</text>
    <text x="67" y="156" font-family="Consolas,'SF Mono',monospace" font-size="18" fill="#38bdf8" letter-spacing="1">AI · DATA · PRODUCT ENGINEER</text>
    <text x="67" y="184" font-family="Consolas,'SF Mono',monospace" font-size="14" fill="#8ea3bd">co-founder @ Ardeno Studio</text>
    <text x="67" y="206" font-family="Consolas,'SF Mono',monospace" font-size="13" fill="#8ea3bd">Colombo, Sri Lanka · BSc AI &amp; Data Science</text>
    <text x="67" y="262" font-family="Consolas,'SF Mono',monospace" font-size="28" font-weight="700" fill="#f4f9ff"><tspan fill="#f4f9ff">SUVEN</tspan><tspan fill="#38bdf8">//</tspan><tspan fill="#7fe9c7">OS</tspan></text>
    <rect class="caret" x="240" y="241" width="11" height="25" fill="#34d399"/>
  </g>

  <!-- ===== LANE CHIPS D ===== -->
  <g font-family="Consolas,'SF Mono',monospace" font-size="14">
    <rect x="48" y="300" width="54" height="34" rx="7" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".55"/>
    <text x="62" y="322" fill="#38bdf8">WEB</text>
    <rect x="116" y="300" width="62" height="34" rx="7" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".55"/>
    <text x="130" y="322" fill="#34d399">DATA</text>
    <rect x="192" y="300" width="112" height="34" rx="7" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".55"/>
    <text x="206" y="322" fill="#fbbf24">AUTOMATION</text>
    <rect x="318" y="300" width="45" height="34" rx="7" fill="#fb7185" fill-opacity=".12" stroke="#fb7185" stroke-opacity=".55"/>
    <text x="332" y="322" fill="#fb7185">AI</text>
  </g>

  <!-- ===== EKG / PIPELINE CARD F ===== -->
  <g>
    <rect x="548" y="60" width="286" height="122" rx="10" fill="#060c17" fill-opacity=".5" stroke="#38bdf8" stroke-opacity=".22"/>
    <text x="562" y="80" font-family="Consolas,'SF Mono',monospace" font-size="11" fill="#8ea3bd" letter-spacing="1">SCOPE // PIPELINE</text>
    <line x1="560" y1="104" x2="822" y2="104" stroke="#38bdf8" stroke-opacity=".1"/>
    <line x1="560" y1="132" x2="822" y2="132" stroke="#38bdf8" stroke-opacity=".1"/>
    <line x1="560" y1="160" x2="822" y2="160" stroke="#38bdf8" stroke-opacity=".1"/>
    <path d="M560 140 L600 140 L612 118 L624 162 L636 100 L648 140 L690 140 L702 128 L714 150 L726 140 L770 140 L782 112 L794 168 L806 120 L822 140" fill="none" stroke="#34d399" stroke-opacity=".18" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="ekg" d="M560 140 L600 140 L612 118 L624 162 L636 100 L648 140 L690 140 L702 128 L714 150 L726 140 L770 140 L782 112 L794 168 L806 120 L822 140" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- ===== METRIC + LED CARD G ===== -->
  <g>
    <rect x="548" y="198" width="286" height="124" rx="10" fill="#060c17" fill-opacity=".5" stroke="#38bdf8" stroke-opacity=".22"/>
    <line class="flow" x1="690" y1="214" x2="690" y2="306" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1"/>
    <!-- LED rail -->
    <circle cx="566" cy="219" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.3;1" dur="1.7s" repeatCount="indefinite"/></circle>
    <text x="580" y="223" font-family="Consolas,'SF Mono',monospace" font-size="12" fill="#cdd9ea">SEOS</text>
    <circle cx="566" cy="249" r="4" fill="#fbbf24"><animate attributeName="opacity" values="1;.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <text x="580" y="253" font-family="Consolas,'SF Mono',monospace" font-size="12" fill="#cdd9ea">AGENTGUARD</text>
    <circle cx="566" cy="279" r="4" fill="#38bdf8"><animate attributeName="opacity" values="1;.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <text x="580" y="283" font-family="Consolas,'SF Mono',monospace" font-size="12" fill="#cdd9ea">PIPELINES</text>
    <!-- metric readouts -->
    <text x="706" y="223" font-family="Consolas,'SF Mono',monospace" font-size="10" fill="#8ea3bd">LANES</text>
    <text x="822" y="223" font-family="Consolas,'SF Mono',monospace" font-size="14" fill="#38bdf8" text-anchor="end">4</text>
    <text x="706" y="253" font-family="Consolas,'SF Mono',monospace" font-size="10" fill="#8ea3bd">SYSTEMS</text>
    <text x="822" y="253" font-family="Consolas,'SF Mono',monospace" font-size="14" fill="#34d399" text-anchor="end">10+</text>
    <text x="706" y="283" font-family="Consolas,'SF Mono',monospace" font-size="10" fill="#8ea3bd">LOCALE</text>
    <text x="822" y="283" font-family="Consolas,'SF Mono',monospace" font-size="14" fill="#fbbf24" text-anchor="end">LK</text>
  </g>

  <!-- ===== RADAR CARD E ===== -->
  <g>
    <rect x="858" y="60" width="296" height="216" rx="10" fill="#060c17" fill-opacity=".5" stroke="#38bdf8" stroke-opacity=".25"/>
    <text x="872" y="80" font-family="Consolas,'SF Mono',monospace" font-size="11" fill="#8ea3bd" letter-spacing="1">SCOPE</text>
    <text x="1140" y="266" font-family="Consolas,'SF Mono',monospace" font-size="11" fill="#8ea3bd" text-anchor="end">AZ 312°</text>
    <text x="872" y="266" font-family="Consolas,'SF Mono',monospace" font-size="11" fill="#8ea3bd">RNG 12k</text>
    <g>
      <circle cx="1006" cy="168" r="36" fill="none" stroke="#38bdf8" stroke-opacity=".3"/>
      <circle cx="1006" cy="168" r="68" fill="none" stroke="#38bdf8" stroke-opacity=".2"/>
      <circle cx="1006" cy="168" r="96" fill="none" stroke="#38bdf8" stroke-opacity=".13"/>
      <line x1="910" y1="168" x2="1102" y2="168" stroke="#38bdf8" stroke-opacity=".15"/>
      <line x1="1006" y1="72" x2="1006" y2="264" stroke="#38bdf8" stroke-opacity=".15"/>
      <!-- sweep -->
      <path d="M1006 168 L1102 134 A96 96 0 0 1 1102 202 Z" fill="url(#sweepGrad)" filter="url(#soft)">
        <animateTransform attributeName="transform" type="rotate" from="0 1006 168" to="360 1006 168" dur="6s" repeatCount="indefinite"/>
      </path>
      <!-- phosphor blips, phase-locked to sweep -->
      <circle cx="1006" cy="240" r="4" fill="#34d399"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.08;.5;1" dur="6s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="943" cy="132" r="4" fill="#fbbf24"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.08;.5;1" dur="6s" begin="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="1069" cy="132" r="4" fill="#fb7185"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.08;.5;1" dur="6s" begin="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="1006" cy="168" r="3" fill="#7fe9c7"/>
    </g>
  </g>

  <!-- ===== LIVE TICKER I ===== -->
  <g>
    <rect x="32" y="346" width="1136" height="40" rx="9" fill="#060c17" fill-opacity=".7" stroke="#16243c"/>
    <text x="48" y="371" font-family="Consolas,'SF Mono',monospace" font-size="13" fill="#8ea3bd">LIVE</text>
    <g clip-path="url(#tickerClip)">
      <g font-family="Consolas,'SF Mono',monospace" font-size="14">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1228 0" dur="24s" repeatCount="indefinite"/>
        <text x="110" y="371" fill="#f4f9ff">OCTANE<tspan fill="#fbbf24"> ◆ </tspan>PROPERTYLK<tspan fill="#fbbf24"> ◆ </tspan>AUTOLENS LK<tspan fill="#fbbf24"> ◆ </tspan>FOODLK<tspan fill="#fbbf24"> ◆ </tspan>ARIVA<tspan fill="#fbbf24"> ◆ </tspan>CEYLONGRID<tspan fill="#fbbf24"> ◆ </tspan>SEYLAN HUB<tspan fill="#fbbf24"> ◆ </tspan><tspan fill="#fb7185">SEOS</tspan><tspan fill="#fbbf24"> ◆ </tspan>AGENTGUARD<tspan fill="#fbbf24"> ◆ </tspan>LANKA NLP BENCH<tspan fill="#fbbf24"> ◆ </tspan></text>
        <text x="1338" y="371" fill="#f4f9ff">OCTANE<tspan fill="#fbbf24"> ◆ </tspan>PROPERTYLK<tspan fill="#fbbf24"> ◆ </tspan>AUTOLENS LK<tspan fill="#fbbf24"> ◆ </tspan>FOODLK<tspan fill="#fbbf24"> ◆ </tspan>ARIVA<tspan fill="#fbbf24"> ◆ </tspan>CEYLONGRID<tspan fill="#fbbf24"> ◆ </tspan>SEYLAN HUB<tspan fill="#fbbf24"> ◆ </tspan><tspan fill="#fb7185">SEOS</tspan><tspan fill="#fbbf24"> ◆ </tspan>AGENTGUARD<tspan fill="#fbbf24"> ◆ </tspan>LANKA NLP BENCH<tspan fill="#fbbf24"> ◆ </tspan></text>
      </g>
    </g>
  </g>

  <rect x="16" y="16" width="1168" height="378" rx="14" fill="none" stroke="#38bdf8" stroke-opacity=".35"/>
</svg>
